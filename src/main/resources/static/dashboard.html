<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Logs Dashboard</h1>

    <input type="text" id="search" placeholder="Search..." onkeyup="filterTable()">
<button onclick="downloadPNG()">Get Report Image</button>    <table id="logTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Source</th>
                <th>Destination</th>
                <th>Action</th>
                <th>Protocol</th>
                <th>Port</th>
                <th>Info</th>
                <th>Risk</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>
    </table>

</div>

<script src="script.js"></script>
</body>
</html>
